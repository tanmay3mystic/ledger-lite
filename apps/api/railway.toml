# Railway reads this file from the service root directory.
# Set "Root Directory" to apps/api once in the Railway UI — everything else lives here.
#
# UI-only (cannot be expressed in TOML):
#   - Root Directory : apps/api
#   - Branch         : development (staging) / production
#   - Environment variables
#   - Custom domains

[build]
builder      = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand          = "npm start"
healthcheckPath       = "/health"
healthcheckTimeout    = 300
restartPolicyType     = "ON_FAILURE"
restartPolicyMaxRetries = 10
