# Railway reads this file from the service root directory.
# Set "Root Directory" to apps/parser once in the Railway UI — everything else lives here.
#
# UI-only (cannot be expressed in TOML):
#   - Root Directory : apps/parser
#   - Branch         : development (staging) / production
#   - Environment variables
#   - Custom domains

[build]
builder      = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand          = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath       = "/health"
healthcheckTimeout    = 300
restartPolicyType     = "ON_FAILURE"
restartPolicyMaxRetries = 10
