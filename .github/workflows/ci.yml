# Runs on every pull request targeting development or production.
# This is the gate that must pass before a PR can be merged.
# Deployment is handled by separate per-branch workflows.

name: CI

on:
  pull_request:
    branches: [development, production]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── Node.js: lint, typecheck, build ──────────────────────────────────────────
  node:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Turbo cache keyed on lockfile + SHA; falls back to lockfile prefix
      # so prior-commit artifacts are reused on first run of a new commit.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo type-check

      - name: Build
        run: pnpm turbo build
        env:
          # Next.js needs this at build time; placeholder is fine in CI.
          NEXT_PUBLIC_API_URL: https://placeholder-build-only.invalid

  # ── Python: install + test ────────────────────────────────────────────────────
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/parser/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/parser/requirements.txt

      - name: Run tests
        run: python -m pytest apps/parser/tests/ -v --tb=short
